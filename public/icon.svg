<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="55%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#171a20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="transparent"/>
      <rect y="0" width="8" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="192" fill="url(#bg)"/>
  <rect x="68" y="68" width="888" height="888" rx="148" fill="none" stroke="#2b3038" stroke-width="16"/>
  <rect x="90" y="90" width="844" height="844" rx="128" fill="url(#scan)" opacity="0.25"/>

  <g stroke="url(#accent)" stroke-width="16" fill="none" stroke-linecap="round">
    <path d="M148 256 H260"/>
    <path d="M148 768 H260"/>
    <path d="M764 256 H876"/>
    <path d="M764 768 H876"/>
    <path d="M256 148 V260"/>
    <path d="M768 148 V260"/>
    <path d="M256 764 V876"/>
    <path d="M768 764 V876"/>
  </g>

  <path d="M356 232 H668 L792 356 V668 L668 792 H356 L232 668 V356 Z" fill="none" stroke="#2c3139" stroke-width="24"/>
  <path d="M384 264 H640 L760 384 V640 L640 760 H384 L264 640 V384 Z" fill="none" stroke="url(#accent)" stroke-width="12" opacity="0.9" filter="url(#glow)"/>

  <text x="314" y="612" fill="#ffffff" font-family="Orbitron, Arial, sans-serif" font-size="300" font-weight="900" letter-spacing="-20">R</text>
  <text x="534" y="612" fill="url(#accent)" font-family="Orbitron, Arial, sans-serif" font-size="300" font-weight="900" letter-spacing="-20">Z</text>

  <rect x="360" y="676" width="304" height="16" rx="8" fill="#2c3139"/>
  <rect x="386" y="676" width="252" height="16" rx="8" fill="url(#accent)"/>
</svg>
