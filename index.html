<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: file:; media-src 'self' blob: data: https:; connect-src 'self' blob: https: ws: wss:;">
    <link rel="icon" type="image/png" href="./favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aichemy</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Nunito', sans-serif; }
      /* Hide scrollbar for clean look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgb(var(--bg));
      }
      ::-webkit-scrollbar-thumb {
        background: rgb(var(--dim));
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--dim));
      }
    </style>
</head>
  <body class="bg-base text-ink antialiased">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aichemy-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
